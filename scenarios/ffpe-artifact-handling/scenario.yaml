samples:
  ffpetumor:
    universe: "[0.0,1.0]"
    resolution: 0.01
    fragment_end_bias: true # allows to detect errors induced by the very same FFPE fragment

expressions:
  ffpe_subst: "C>T | G>A"

events:
  ffpe_artifact: "($ffpe_subst) & ffpetumor:]0.0,0.05["
  present: "(($ffpe_subst) & ffpetumor:]0.05,1.0]) | (!($ffpe_subst) & ffpetumor:]0.0,1.0[)"
